# Compose Manager project "automation" на Unraid.
# Секреты — в .env рядом (не в git): RADARR_API_KEY, PROWLARR_API_KEY, LITELLM_MASTER_KEY, GEMINI_API_KEY, GROQ_API_KEY, OPENROUTER_API_KEY, MISTRAL_API_KEY
services:
  release-judge:
    image: postnikovm/release-judge:0.1      # пиним minor; latest — только для теста
    container_name: release-judge
    restart: unless-stopped
    ports: ["3100:3100"]
    volumes:
      - /mnt/user/data:/data:ro                       # те же пути, что у Radarr (/data/media, /data/torrents)
      - /mnt/user/appdata/release-judge/state:/state
      - /mnt/user/appdata/release-judge/config:/config
    environment:
      RADARR_URL: http://192.168.1.244:7878
      RADARR_API_KEY: ${RADARR_API_KEY}
      PROWLARR_URL: http://192.168.1.244:9696
      PROWLARR_API_KEY: ${PROWLARR_API_KEY}
      HARDLINKS_URL: http://192.168.1.244:3000
      LLM_BASE_URL: http://litellm:4000/v1
      LLM_API_KEY: ${LITELLM_MASTER_KEY}
      LLM_MODEL: extract
    depends_on: [litellm]

  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    container_name: litellm
    restart: unless-stopped
    ports: ["4000:4000"]
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    volumes:
      - /mnt/user/appdata/litellm/config.yaml:/app/config.yaml:ro
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GROQ_API_KEY: ${GROQ_API_KEY}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY}
      # HTTPS_PROXY: http://<xray-http-proxy>:port   # если какой-то провайдер режет RU
