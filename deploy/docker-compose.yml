# Compose Manager project "automation" на Unraid. Данные: /mnt/user/appdata/automation/{release-judge,litellm}
# Секреты — в .env рядом (не в git): RADARR_API_KEY, PROWLARR_API_KEY, TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID, LITELLM_MASTER_KEY, LITELLM_UI_PASSWORD, LITELLM_DB_PASSWORD
services:
  release-judge:
    image: postnikovm/release-judge:0.5      # пиним minor; latest — только для теста
    container_name: release-judge
    restart: unless-stopped
    ports: ["3100:3100"]
    volumes:
      - /mnt/user/data:/data:ro                       # те же пути, что у Radarr (/data/media, /data/torrents)
      - /mnt/user/appdata/automation/release-judge/state:/state
      - /mnt/user/appdata/automation/release-judge/config:/config
      - /mnt/user/appdata/prowlarr:/prowlarr:ro              # сессии трекеров (cookie) берём у Prowlarr
    environment:
      RADARR_URL: http://192.168.1.244:7878
      RADARR_API_KEY: ${RADARR_API_KEY}
      PROWLARR_URL: http://192.168.1.244:9696
      PROWLARR_API_KEY: ${PROWLARR_API_KEY}
      HARDLINKS_URL: http://192.168.1.244:3000
      FLARESOLVERR_URL: http://192.168.1.244:8191
      PROWLARR_DB: /prowlarr/prowlarr.db
      LLM_BASE_URL: http://litellm:4000/v1
      LLM_API_KEY: ${LITELLM_MASTER_KEY}
      LLM_MODEL: extract
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
      TZ: Europe/Moscow
      DISCOVERY_AT: "02:30"          # ночная проверка кандидатов
      DISCOVERY_LIMIT: "30"          # фильмов за ночь (ротация по всей библиотеке)
    depends_on: [litellm]

  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    container_name: litellm
    restart: unless-stopped
    ports: ["4000:4000"]
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    volumes:
      - /mnt/user/appdata/automation/litellm/config.yaml:/app/config.yaml:ro
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      DATABASE_URL: postgresql://litellm:${LITELLM_DB_PASSWORD}@litellm-db:5432/litellm
      STORE_MODEL_IN_DB: "True"                     # провайдеры/ключи можно добавлять в UI
      UI_USERNAME: admin
      UI_PASSWORD: ${LITELLM_UI_PASSWORD}
      # HTTPS_PROXY: http://<xray-http-proxy>:port   # если какой-то провайдер режет RU
    depends_on:
      litellm-db: { condition: service_healthy }

  litellm-db:
    image: postgres:17-alpine
    container_name: litellm-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: litellm
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: ${LITELLM_DB_PASSWORD}
    volumes:
      - /mnt/user/appdata/automation/litellm-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm -d litellm"]
      interval: 10s
      retries: 10
