# Модели и ключи провайдеров хранятся в Postgres (STORE_MODEL_IN_DB) и управляются через UI: http://<unraid>:4000/ui
# Public Model Name = "extract" у всех моделей для release-judge — роутер балансирует между ними
# и на 429 уводит модель в cooldown, переключаясь на следующую.
# Текущие (2026-10-31): groq/openai/gpt-oss-120b (rpm 25, tpm 7k, reasoning_effort=low), groq/qwen/qwen3.8-27b (rpm 25, tpm 5k).
# Mistral убран: бесплатный API-план (Experiment) больше не выдаётся.
model_list: []

router_settings:
  routing_strategy: usage-based-routing-v2
  num_retries: 2
  allowed_fails: 1
  cooldown_time: 120

litellm_settings:
  drop_params: true
  request_timeout: 90
