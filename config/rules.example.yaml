# Правила сравнения релизов ОДНОГО уровня качества (Remux-2160p vs Remux-2160p и т.п.).
# Грубые шаги качества (WEB-DL -> Remux, 1080p -> 2160p) делает Radarr сам — сюда не попадают.

trackers:
  # тай-брейк, когда всё остальное равно
  priority: [TeamHD, Tapochek]        # остальные — после них

hard_reject:                          # кандидат отбрасывается без вопросов
  dv_profile_5: true                  # DV без HDR10-фоллбэка (не будет direct play)
  upscale: true
  lose_russian_dub: true              # внутри одного уровня качества дубляж терять нельзя
  # BR-DISK (структура диска BDMV/m2ts вместо mkv) отбрасывается всегда, без переключателя

flags_to_review:                      # не отказ, но решение — через Telegram
  localized_video: true               # «Локализованный видеоряд»
  lose_cult_translation: true         # пропадает перевод из списка cult_translations
  # смена редакции (theatrical <-> extended) проверяется по длительности файла всегда, без переключателя

# Сравнение по порядку: первый пункт, где есть разница, решает (если нет потерь из flags_to_review)
compare_order:
  - video                             # HDR10+ (универсальный, шире поддержка) > DV (любой профиль/слой — P7 FEL = P7 MEL = P8, не различаем) > HDR10 > HLG > SDR
  - russian_dub                       # 1) есть ли дубляж; 2) класс кодека (lossless > DTS/EAC3 > AC3); 3) каналы; 4) битрейт целыми Мбит/с (разница < 1 Мбит/с — шум); 5) Atmos.
                                       # Цель — 7.1 Atmos на 4-8 Мбит/с. MVO НЕ сравнивается (см. ниже) — его теряем молча, если дубляж уже есть
  - original_audio                    # только тай-брейк/бонус, если всё выше равно — не блокирует и не двигает вердикт сам по себе
  - subtitles                         # наличие rus full / forced
  - tracker                           # TeamHD > Tapochek > прочие
  # MVO/DVO/AVO (кроме cult_translations), комментарии, дорожки на иных языках (не рус, не оригинал) — НЕ сравниваются:
  # терять их не страшно, в т.ч. намеренно экономит место. Авторские переводы особенно не критичны, когда дорожек и так много.

# редакция сравнивается первой: длиннее (Extended/Director/Uncut) -> REVIEW, короче текущей -> REJECT (решает длительность файла, не надпись в названии)
# дубляж: lossless -> lossy и смена студии -> REVIEW; RUS(ext) -> REVIEW с пометкой

# Авторские переводы, потерю которых нельзя пропускать молча. Чем качественнее культовая озвучка — тем лучше.
# match — regex по названию дорожки/описанию; titles — опционально ограничить фильмами (tmdbId)
cult_translations:
  - name: Гоблин (Пучков)
    match: '(?i)гоблин|пучков|goblin|puchkov'
  - name: Гаврилов
    match: '(?i)гаврилов|gavrilov'
    only_if_year_before: 2000
  - name: Володарский
    match: '(?i)володарск|volodarsk'
    only_if_year_before: 2000
  - name: Михалёв
    match: '(?i)михал[её]в|mikhalev'
    only_if_year_before: 2000

# Действия: вердикт UPGRADE всегда идёт карточкой в Telegram с кнопкой «Заменить» — автозамены без подтверждения нет.
